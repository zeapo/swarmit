[package]
name = "swarmit"
version = "1.0.2"
edition = "2021"
authors = ["zeapo"]
license = "Apache-2.0"
description = "Local-first project management for multi-agent workflows"
repository = "https://github.com/zeapo/swarmit"
keywords = ["project-management", "agents", "tui", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".idea/", "docs/", ".swarmit/", ".claude/", "crates/"]

[lib]
name = "swarmit"
path = "src/lib.rs"

[[bin]]
name = "swarmit"
path = "src/main.rs"

[features]
profiling = ["dep:tracing", "dep:tracing-chrome", "dep:tracing-subscriber"]

[dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Snapshot storage
rusqlite = { version = "0.32", features = ["bundled"] }

# Time
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# TUI
ratatui = "0.30"
crossterm = "0.29"
catppuccin = { version = "2", features = ["ratatui"] }
terminal-colorsaurus = "1"
bat = { version = "0.26", default-features = false, features = ["regex-fancy"] }
syntect = { version = "5", default-features = false }

# Profiling (optional)
tracing = { version = "0.1", optional = true }
tracing-chrome = { version = "0.7", optional = true }
tracing-subscriber = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = false
